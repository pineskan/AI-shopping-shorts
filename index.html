
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101827">
<title>AI Shopping Shorts</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  padding:20px;
  background:#101827;
  color:white;
  font-family:Arial,sans-serif
}

main{max-width:520px;margin:25px auto}

h1{text-align:center;color:#16c784}
.subtitle{text-align:center;color:#bdc8d8}

.card{
  background:#1d293b;
  padding:18px;
  margin:15px 0;
  border-radius:12px
}

input,select,textarea{
  width:100%;
  padding:13px;
  margin:8px 0;
  border-radius:8px;
  border:1px solid #46546b;
  background:#101827;
  color:white;
  font-size:15px
}

button{
  width:100%;
  padding:16px;
  margin:10px 0;
  border:0;
  border-radius:9px;
  background:#16c784;
  color:#071b14;
  font-size:16px;
  font-weight:bold;
  cursor:pointer
}

button:disabled{opacity:.5;cursor:wait}

#startButton{font-size:19px;padding:20px}

.secondary{
  background:#40516b;
  color:white
}

#status{
  text-align:center;
  margin:20px 0;
  color:#16c784;
  overflow-wrap:anywhere
}

.small{
  color:#aab7ca;
  font-size:13px;
  line-height:1.6
}

video{
  width:100%;
  margin-top:15px;
  border-radius:10px
}

a{
  color:#16c784;
  display:block;
  margin:15px 0;
  text-align:center
}

.product-item{
  background:#101827;
  border:1px solid #46546b;
  border-radius:10px;
  padding:12px;
  margin:12px 0;
}

.product-item img{
  width:100%;
  height:180px;
  object-fit:contain;
  border-radius:8px;
  background:white;
}

.product-item h4{
  line-height:1.4;
  margin:10px 0;
}

.product-price{
  color:#16c784;
  font-size:18px;
  font-weight:bold;
}

.product-store{
  color:#aab7ca;
  font-size:13px;
}

.product-item button{
  margin-bottom:0;
}

</style>
</head>

<body>
<main>

<h1>AI Shopping Shorts</h1>
<p class="subtitle">One-Click AI Video Creator</p>

<!-- US TRENDING PRODUCTS -->

<div class="card">

<h3>🇺🇸 US Trending Products</h3>

<p class="small">
Discover popular products from US shopping search results.
</p>

<input
 id="searchQuery"
 value="popular trending products"
 placeholder="Search products"
>

<button
 type="button"
 id="searchButton"
 onclick="findProducts()"
>
FIND TOP 5 US PRODUCTS
</button>

<div id="products"></div>

</div>

<!-- PRODUCT INFORMATION -->

<div class="card">

<h3>Product Information</h3>

<input
 id="product"
 placeholder="Product name"
 value="Wireless Earbuds"
>

<input
 id="imageUrl"
 type="url"
 placeholder="Public HTTPS product image URL"
>

</div>

<!-- ADVERTISEMENT SETTINGS -->

<div class="card">

<h3>Advertisement Settings</h3>

<select id="voice">
<option value="female">Female Voice</option>
<option value="male">Male Voice</option>
</select>

<button
 type="button"
 onclick="previewVoice()"
>
PREVIEW VOICE
</button>

<h3>Advertisement Script</h3>

<textarea
 id="script"
 rows="6"
 placeholder="Your AI advertisement script will appear here."
></textarea>

<button
 type="button"
 id="scriptButton"
 onclick="generateScriptButton()"
>
GENERATE SCRIPT
</button>

</div>

<!-- VIDEO PRODUCTION -->

<div class="card">

<h3>Video Production</h3>

<p class="small">
AI voice and video will be generated automatically.
</p>

<button
 type="button"
 id="startButton"
 onclick="startAutomation()"
>
START AUTOMATION
</button>

<div id="video"></div>

</div>

<div id="status">Ready to start</div>

</main>

<script>

const $ = id => document.getElementById(id);

let busy = false;

// STATUS

function status(message){
  $("status").textContent = message;
}

// GET JSON

async function getJSON(url){

  const response = await fetch(url);

  const data = await response.json();

  if(!response.ok){
    throw new Error(data.error || "Request failed");
  }

  return data;
}

// POST JSON

async function post(url,body){

  const response = await fetch(url,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify(body)
  });

  const data = await response.json();

  if(!response.ok){
    throw new Error(data.error || "Request failed");
  }

  return data;
}

// FIND US TRENDING PRODUCTS

async function findProducts(){

  if(busy) return;

  const query = $("searchQuery").value.trim();

  if(!query){
    alert("Enter a product search keyword.");
    return;
  }

  busy = true;

  $("searchButton").disabled = true;
  $("products").replaceChildren();

  status("Searching US shopping products...");

  try{

    const data = await getJSON(
      "/api/trending?q=" + encodeURIComponent(query)
    );

    if(!data.products || data.products.length === 0){
      status("No products found. Try another search.");
      return;
    }

    data.products.forEach(item => {

      const card = document.createElement("div");
      card.className = "product-item";

      const image = document.createElement("img");
      image.alt = item.name || "Product image";
      image.loading = "lazy";

      if(item.imageUrl){
        image.src = item.imageUrl;
      }else{
        image.alt = "Image unavailable";
      }

      const name = document.createElement("h4");
      name.textContent =
        item.rank + ". " + item.name;

      const price = document.createElement("div");
      price.className = "product-price";
      price.textContent = item.price;

      const store = document.createElement("div");
      store.className = "product-store";
      store.textContent = "Store: " + item.store;

      const selectButton = document.createElement("button");
      selectButton.textContent = "SELECT THIS PRODUCT";

      selectButton.onclick = () => {

        $("product").value = item.name;

        $("imageUrl").value = item.imageUrl || "";

        $("script").value = "";

        $("video").replaceChildren();

        status("Product selected: " + item.name);

        window.scrollTo({
          top: 0,
          behavior: "smooth"
        });

      };

      card.append(
        image,
        name,
        price,
        store,
        selectButton
      );

      if(item.productUrl){

        const link = document.createElement("a");

        link.href = item.productUrl;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.textContent = "VIEW PRODUCT";

        card.append(link);
      }

      $("products").append(card);

    });

    status(
      "Found " + data.products.length +
      " shopping results."
    );

  }catch(error){

    status("SEARCH ERROR: " + error.message);

  }finally{

    busy = false;
    $("searchButton").disabled = false;

  }
}

// GENERATE SCRIPT

async function generateScript(product){

  status("Generating English advertisement...");

  const data = await post("/api/generate",{
    product:product
  });

  if(!data.script){
    throw new Error("No advertisement script returned");
  }

  $("script").value = data.script;

  status("Advertisement script generated successfully!");

  return data.script;
}

// GENERATE SCRIPT BUTTON

async function generateScriptButton(){

  if(busy) return;

  const product = $("product").value.trim();

  if(!product){
    alert("Enter a product name.");
    return;
  }

  busy = true;

  $("scriptButton").disabled = true;
  $("startButton").disabled = true;

  try{

    $("script").value = "";

    await generateScript(product);

  }catch(error){

    status("ERROR: " + error.message);

  }finally{

    busy = false;

    $("scriptButton").disabled = false;
    $("startButton").disabled = false;

  }
}

// PREVIEW VOICE

function previewVoice(){

  const script = $("script").value.trim();

  if(!script){
    alert("Generate your script first.");
    return;
  }

  if(!("speechSynthesis" in window)){
    alert("Voice preview is not supported.");
    return;
  }

  const utterance =
    new SpeechSynthesisUtterance(script);

  utterance.lang = "en-US";
  utterance.rate = 0.95;

  utterance.pitch =
    $("voice").value === "female" ? 1.15 : 0.85;

  speechSynthesis.cancel();
  speechSynthesis.speak(utterance);
}

// GENERATE AI VOICE

async function generateVoice(script){

  status("2/4 Generating AI voice...");

  const data = await post("/api/voice",{
    script:script,
    voice:$("voice").value
  });

  if(!data.audioUrl){
    throw new Error("No audio URL returned");
  }

  return data.audioUrl;
}

// CREATE VIDEO

async function renderVideo(
  script,
  imageUrl,
  audioUrl
){

  status("3/4 Sending video to Shotstack...");

  const data = await post("/api/render",{
    script:script,
    imageUrl:imageUrl,
    audioUrl:audioUrl
  });

  const id = data.response?.id;

  if(!id){
    throw new Error("Render ID missing");
  }

  return id;
}

// CHECK VIDEO STATUS

async function waitForVideo(id){

  for(let i=0;i<60;i++){

    await new Promise(resolve =>
      setTimeout(resolve,5000)
    );

    const data = await getJSON(
      "/api/render?id=" + encodeURIComponent(id)
    );

    const render = data.response;

    status(
      "4/4 Video status: " +
      (render.status || "processing")
    );

    if(render.status === "done"){

      if(!render.url){
        throw new Error("Video URL missing");
      }

      const player =
        document.createElement("video");

      player.controls = true;
      player.playsInline = true;
      player.src = render.url;

      const link =
        document.createElement("a");

      link.href = render.url;
      link.download = "shopping-shorts.mp4";
      link.textContent = "SAVE MP4 VIDEO";

      $("video").replaceChildren(player,link);

      status("SUCCESS! Your video is ready.");

      return;
    }

    if(render.status === "failed"){

      throw new Error(
        render.error || "Video rendering failed"
      );
    }
  }

  throw new Error("Rendering timed out.");
}

// START AUTOMATION

async function startAutomation(){

  if(busy) return;

  const product = $("product").value.trim();
  const imageUrl = $("imageUrl").value.trim();

  if(!product){
    alert("Enter a product name.");
    return;
  }

  if(!/^https:\/\/.+/i.test(imageUrl)){
    alert("Select a product or enter a public HTTPS image URL.");
    return;
  }

  busy = true;

  $("startButton").disabled = true;
  $("scriptButton").disabled = true;
  $("searchButton").disabled = true;

  $("video").replaceChildren();

  try{

    let script = $("script").value.trim();

    if(!script){
      script = await generateScript(product);
    }

    const audioUrl = await generateVoice(script);

    const id = await renderVideo(
      script,
      imageUrl,
      audioUrl
    );

    await waitForVideo(id);

  }catch(error){

    status("ERROR: " + error.message);

  }finally{

    busy = false;

    $("startButton").disabled = false;
    $("scriptButton").disabled = false;
    $("searchButton").disabled = false;

  }
}

</script>

</body>
</html>
